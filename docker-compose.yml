version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: app_gastos_db
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword
      POSTGRES_DB: gastosdb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: app_gastos_backend
    restart: always
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=admin
      - DB_PASSWORD=adminpassword
      - DB_NAME=gastosdb
      - JWT_SECRET=supersecret123
      - PORT=3000
    depends_on:
      - postgres
    # Remove ports mapping in production if you only want Nginx to access it,
    # but for Dokploy debugging you can leave it or remove it.
    ports:
      - "3000:3000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: app_gastos_frontend
    restart: always
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  pgdata:
