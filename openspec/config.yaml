schema: spec-driven

context: |
  Tech stack: Ionic/React 19 (frontend) + Node/Express 5 (backend), TypeScript throughout
  Architecture: REST API monorepo — frontend Vite/Ionic SPA, backend Express+pg (PostgreSQL)
  Testing: Vitest (unit) + Cypress (E2E) on frontend; no backend tests yet
  Style: ESLint + TypeScript strict on frontend; tsx watch for backend dev
  Data encryption: AES on sensitive fields (account names, descriptions, tags) via utils/crypto
  Import format expected: XLSX with columns Fecha/Descripción/Valor/Cuenta/Situación/Categoria

testing:
  strict_tdd: false
  runner: vitest (frontend) / no runner (backend)
  layers:
    unit: true  # vitest
    integration: true  # @testing-library/react
    e2e: true  # cypress
  coverage: true  # vitest --coverage
  quality:
    linter: eslint (frontend)
    type_checker: tsc (both)
    formatter: not configured

strict_tdd: false

rules:
  proposal:
    - Include rollback plan for risky changes
    - Identify affected modules/packages
  specs:
    - Use Given/When/Then format for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Include sequence diagrams for complex flows
    - Document architecture decisions with rationale
  tasks:
    - Group tasks by phase (infrastructure, implementation, testing)
    - Use hierarchical numbering (1.1, 1.2, etc.)
    - Keep tasks small enough to complete in one session
  apply:
    - Follow existing code patterns and conventions
    - Load relevant coding skills for the project stack
  verify:
    - Run tests if test infrastructure exists
    - Compare implementation against every spec scenario
  archive:
    - Warn before merging destructive deltas (large removals)
